apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-deploy
  labels:
    app: checkout-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-deploy
  template:
    metadata:
      labels:
        app: checkout-deploy
    spec:
      imagePullSecrets:
      - name: gitlab-registry-key
      serviceAccountName: checkoutservice
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          image: __IMAGE_NAME__ 
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 5050
          env:
            - name: PORT
              value: "5050"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcat-service:3550"
            - name: SHIPPING_SERVICE_ADDR
              value: "shipping-service:50051"
            - name: PAYMENT_SERVICE_ADDR
              value: "payment-service:50051"
            - name: EMAIL_SERVICE_ADDR
              value: "email-service:8080"
            - name: CURRENCY_SERVICE_ADDR
              value: "currency-service:7000"
            - name: CART_SERVICE_ADDR
              value: "cart-service:7070"
          readinessProbe:
            grpc:
              port: 5050
          livenessProbe:
            grpc:
              port: 5050
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
