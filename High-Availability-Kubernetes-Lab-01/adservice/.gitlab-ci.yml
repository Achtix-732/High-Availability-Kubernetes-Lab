stages:
  - sonarqube-check
  - sonarqube-vulnerability-report
  - build
  - trivy-scan
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project

# --- Stage 1: Lint ---

# --- Stage 2: Test --- 

# --- Stage 3: Sonarqube-check ---
sonarqube-check:
  stage: sonarqube-check
  image: gradle:8.5-jdk21
  cache:
    policy: pull-push
    key: "${CI_COMMIT_SHORT_SHA}"
    paths:
      - .sonar/cache
  script:
    - chmod +x gradlew
    - apt-get update && apt-get install -y iputils-ping curl
    - >
      ./gradlew sonar 
      -Dsonar.host.url=$SONAR_HOST_URL 
      -Dsonar.token=$SONAR_TOKEN 
      -Dorg.gradle.vfs.watch=false 
      -Dorg.gradle.daemon=false 
      -x test --info --stacktrace
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

# --- Stage 4: Sonarqube Vulnerability Report ---
sonarqube-vulnerability-report:
  stage: sonarqube-vulnerability-report
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - 'curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=achtix-homelab_ad-service_a48206a5-5f3d-458e-ac1b-bcba60f1fd64&branch=${CI_COMMIT_BRANCH}&pullRequest=${CI_MERGE_REQUEST_IID}" -o gl-sast-sonar-report.json'
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
  artifacts:
    expire_in: 1 day
    reports:
      sast: gl-sast-sonar-report.json

# --- Stage 5: Build ---
build_job:
  stage: build
  image: docker:24.0.5
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  services:
    - name: docker:24.0.5-dind
  before_script:
    - echo "Logging in to $CI_REGISTRY..."
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build -t $IMAGE_NAME .
    - docker push $IMAGE_NAME

# --- Stage 6: Trivy Scan ---
trivy_scan_job:
  stage: trivy-scan
  image:
    name: docker.io/aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
    TRIVY_CACHE_DIR: ".trivycache/"
  script:
    - echo "Scanning image $IMAGE_NAME with Trivy..."
    - trivy --version
    - trivy image --timeout 15m --scanners vuln --exit-code 0 --format template --template "@/contrib/gitlab.tpl" --output gl-container-scanning-report.json "$IMAGE_NAME"
    - trivy image --timeout 15m --scanners vuln --exit-code 0 --severity HIGH,CRITICAL "$IMAGE_NAME"
    - trivy image --timeout 15m --scanners vuln --exit-code 1 --severity CRITICAL "$IMAGE_NAME"
  cache:
    paths:
      - .trivycache/
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json

# --- Stage 7: Deploy ---
deploy_job:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - if [ -z "$KUBE_CONFIG" ]; then echo "❌ KUBE_CONFIG is empty!"; exit 1; fi
    - echo "$KUBE_CONFIG" | base64 -d > kubeconfig.yaml
    - find k8s/ -name "*.yaml" -exec sed -i "s|__IMAGE_NAME__|$IMAGE_NAME|g" {} +
    - kubectl --kubeconfig kubeconfig.yaml apply -f k8s/
    - kubectl --kubeconfig kubeconfig.yaml rollout status deployment/ad-deploy
