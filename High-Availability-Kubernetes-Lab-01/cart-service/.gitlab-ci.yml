stages:
  - sonarqube-check
  - sonarqube-vulnerability-report
  - build
  - trivy-scan
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project

# --- Stage 1: Lint ---

# --- Stage 2: Test --- 

# --- Stage 3: Sonarqube-check ---

sonarqube-check:
  stage: sonarqube-check
  image: mcr.microsoft.com/dotnet/sdk:10.0-noble # ใช้ .NET 10 ให้ตรงกับโปรเจกต์
  cache:
    policy: pull-push
    key: "${CI_COMMIT_SHORT_SHA}"
    paths:
      - .sonar/cache
  script: 
      - apt-get update
      # ติดตั้ง Java 17 สำหรับ SonarScanner และ protobuf-compiler สำหรับแก้ปัญหา gRPC Segfault ตอน Build
      - apt-get install --yes --no-install-recommends openjdk-17-jre protobuf-compiler
      - export PROTOBUF_PROTOC=/usr/bin/protoc
      - export GRPC_PROTOC_PLUGIN_PATH_LINUX_X64=/usr/bin/protoc
      - export GRPC_PROTOC_PLUGIN_PATH_LINUX_ARM64=/usr/bin/protoc
      - dotnet tool install --global dotnet-sonarscanner
      - export PATH="$PATH:$HOME/.dotnet/tools"
      - cd src # เข้าไปที่โฟลเดอร์ของ Source code
      - dotnet sonarscanner begin /k:"achtix-homelab_cart-service_601d08e3-d70a-4f3a-9424-d2c45d4da65f" /d:sonar.token="$SONAR_TOKEN" /d:"sonar.host.url=$SONAR_HOST_URL" 
      - dotnet build cartservice.csproj
      - dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

# --- Stage 4: Sonarqube Vulnerability Report ---

sonarqube-vulnerability-report:
  stage: sonarqube-vulnerability-report
  image: curlimages/curl:latest # ใช้ Image เบาๆ ที่มี curl
  script:
    - 'curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=achtix-homelab_cart-service_601d08e3-d70a-4f3a-9424-d2c45d4da65f&branch=${CI_COMMIT_BRANCH}&pullRequest=${CI_MERGE_REQUEST_IID}" -o gl-sast-sonar-report.json'
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
  artifacts:
    expire_in: 1 day
    reports:
      sast: gl-sast-sonar-report.json

# --- Stage 5: Build และ Push ขึ้น GitLab ---
build_job:
  stage: build
  image: docker:24.0.5
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  services:
    - name: docker:24.0.5-dind
  before_script:
    - echo "Logging in to $CI_REGISTRY..."
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - ls -la
    - cd src
    - docker build --platform linux/arm64 -t $IMAGE_NAME .
    - docker push $IMAGE_NAME

# --- Stage 6: Trivy (สแกนหาช่องโหว่ด้วย Trivy) ---
trivy_scan_job:    
  stage: trivy-scan         
  image:
    name: docker.io/aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
    TRIVY_CACHE_DIR: ".trivycache/"
  script:
    - echo "Scanning image $IMAGE_NAME with Trivy..."
    - trivy --version

    # 1. สแกนและออกรายงานเป็นไฟล์ JSON (เพิ่ม timeout 15 นาที และลดโหลดด้วย scanners vuln)
    - trivy image --timeout 15m --scanners vuln --exit-code 0 --format template --template "@/contrib/gitlab.tpl" --output gl-container-scanning-report.json "$IMAGE_NAME"
    
    # 2. พิมพ์ผลลัพธ์แบบสรุปให้ดูง่ายๆ ใน Log
    - trivy image --timeout 15m --scanners vuln --exit-code 0 --severity HIGH,CRITICAL "$IMAGE_NAME"
    
    # 3. (ทางเลือก) หยุด Pipeline ไม่ให้ Deploy ถ้าเจอช่องโหว่ระดับ CRITICAL
    - trivy image --timeout 15m --scanners vuln --exit-code 1 --severity CRITICAL "$IMAGE_NAME"

  cache:              # 👈 เก็บ Cache ฐานข้อมูลของ Trivy ไว้ใช้รอบหน้า
    paths:
      - .trivycache/      
  artifacts:          # 👈 ส่งไฟล์ Report ไปให้หน้าเว็บ GitLab แสดงผล
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json


# --- Stage 7: Deploy to K8s ---
deploy_job:
  stage: deploy
  image: 
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - if [ -z "$KUBE_CONFIG" ]; then echo "❌ KUBE_CONFIG is empty!"; exit 1; fi
    - echo "$KUBE_CONFIG" | base64 -d > kubeconfig.yaml
    - ls -la kubeconfig.yaml
    - find k8s/ -name "*.yaml" -exec sed -i "s|__IMAGE_NAME__|$IMAGE_NAME|g" {} +
    - cat k8s/deployment.yaml
    - kubectl --kubeconfig kubeconfig.yaml apply -f k8s/
    - kubectl --kubeconfig kubeconfig.yaml rollout status deployment/cart-deploy
