apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: productcat-deploy
  name: productcat-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productcat-deploy
  strategy: {}
  template:
    metadata:
      labels:
        app: productcat-deploy
    spec:
      serviceAccountName: productcatalogservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: __IMAGE_NAME__
        ports:
        - containerPort: 3550
        env:
        - name: PORT
          value: "3550"
        - name: DISABLE_PROFILER
          value: "1"
        readinessProbe:
          grpc:
            port: 3550
        livenessProbe:
          grpc:
            port: 3550
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      imagePullSecrets:
      - name: gitlab-registry-key
status: {}
