apiVersion: v1
kind: Service
metadata:
  name: cart-service
spec:
  ports:
  - name: cart-service
    port: 7070
    protocol: TCP
    targetPort: 7070
  selector:
    app: cart-deploy
  type: ClusterIP
status:
  loadBalancer: {}

---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  labels:
    app: redis-cart
spec:
  type: ClusterIP
  selector:
    app: redis-cart
  ports:
  - name: tcp-redis
    port: 6379
    targetPort: 6379
