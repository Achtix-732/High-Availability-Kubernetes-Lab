apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend-deploy
  name: frontend-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-deploy
  strategy: {}
  template:
    metadata:
      labels:
        app: frontend-deploy
    spec:
      imagePullSecrets:
      - name: gitlab-registry-key
      serviceAccountName: frontend
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: __IMAGE_NAME__
          ports:
          - containerPort: 8080
          readinessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-readiness-probe"
          livenessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-liveness-probe"
          env:
          - name: PORT
            value: "8080"
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            value: "productcat-service:3550"
          - name: CURRENCY_SERVICE_ADDR
            value: "currency-service:7000"
          - name: CART_SERVICE_ADDR
            value: "cart-service:7070"
          - name: RECOMMENDATION_SERVICE_ADDR
            value: "recommendation-service:8080"
          - name: SHIPPING_SERVICE_ADDR
            value: "shipping-service:50051"
          - name: CHECKOUT_SERVICE_ADDR
            value: "checkout-service:5050"
          - name: AD_SERVICE_ADDR
            value: "ad-service:9555"
          - name: SHOPPING_ASSISTANT_SERVICE_ADDR
            value: "shoppingassistant-service:80"
          - name: ENABLE_PROFILER
            value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
          - mountPath: /tmp
            name: tmp-volume
      volumes:
      - name: tmp-volume
        emptyDir: {}
status: {}
